<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceOC | Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0F172A 0%, #020617 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area i {
            font-size: 50px;
            color: #0D9488;
            margin-bottom: 10px;
        }

        .logo-area h2 {
            font-weight: 800;
            color: #0F172A;
        }

        .logo-area p {
            color: #64748B;
            font-size: 14px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #E2E8F0;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #0D9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }

        .form-control.is-invalid {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-label {
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        .form-label .required {
            color: #EF4444;
            margin-left: 2px;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #0D9488;
            color: white;
            font-size: 16px;
            font-weight: 700;
            transition: 0.3s;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #0F766E;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .bottom-link {
            text-align: center;
            margin-top: 20px;
            color: #64748B;
            font-size: 14px;
        }

        .bottom-link a {
            color: #0D9488;
            text-decoration: none;
            font-weight: 600;
        }

        .bottom-link a:hover {
            text-decoration: underline;
        }

        .alert-box {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: none;
            max-width: 400px;
        }

        .alert-inner {
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94A3B8;
            cursor: pointer;
            z-index: 10;
        }

        .toggle-password:hover {
            color: #0D9488;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 4px;
            background: #E2E8F0;
            overflow: hidden;
            transition: all 0.3s;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .password-strength-text {
            font-size: 12px;
            color: #64748B;
            margin-top: 4px;
        }

        @media(max-width:576px) {
            .register-card {
                padding: 24px 20px;
                margin: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="logo-area">
            <i class="fas fa-user-plus"></i>
            <h2>Create Account</h2>
            <p>Join the VoiceOC platform securely</p>
        </div>

        <form id="registerForm">

            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-user me-2"></i>Full Name
                    <span class="required">*</span>
                </label>
                <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-envelope me-2"></i>Email Address
                    <span class="required">*</span>
                </label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-user-tag me-2"></i>Username
                    <span class="required">*</span>
                </label>
                <input type="text" class="form-control" id="username" placeholder="Choose a username" required>
                <small class="text-muted">Minimum 3 characters, letters and numbers only</small>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-lock me-2"></i>Password
                    <span class="required">*</span>
                </label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" placeholder="Create a strong password" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
                <div class="password-strength-text" id="strengthText">Password strength: Weak</div>
                <small class="text-muted">Minimum 6 characters with at least one uppercase letter and one number</small>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-check-circle me-2"></i>Confirm Password
                    <span class="required">*</span>
                </label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                    <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
                </div>
                <div id="confirmPasswordError" class="text-danger" style="font-size: 12px; display: none;">Passwords do not match</div>
            </div>

            <!-- Phone (Optional) -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-phone me-2"></i>Phone Number
                </label>
                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number (optional)">
            </div>

            <!-- Company (Optional) -->
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-building me-2"></i>Company Name
                </label>
                <input type="text" class="form-control" id="company" placeholder="Enter your company name (optional)">
            </div>

            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label" for="termsCheck">
                    I agree to the <a href="#" style="color:#0D9488; text-decoration:none;">Terms of Service</a> and 
                    <a href="#" style="color:#0D9488; text-decoration:none;">Privacy Policy</a>
                    <span class="required">*</span>
                </label>
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                <span id="registerText"><i class="fas fa-user-plus me-2"></i>Create Account</span>
            </button>

        </form>

        <div class="bottom-link">
            Already have an account? <a href="index.html">Sign in here</a>
        </div>

    </div>

    <div class="alert-box" id="alertBox"></div>

    <script>
        // =====================================
        // CHECK IF ALREADY LOGGED IN
        // =====================================
        if (localStorage.getItem('voiceoc_logged_in') === 'true') {
            window.location.href = 'dashboard.html';
        }

        // =====================================
        // ALERT FUNCTION
        // =====================================
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            const color = type === 'success' ? '#10B981' : '#EF4444';
            
            // Clear previous alerts
            alertBox.innerHTML = '';
            
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-inner';
            alertDiv.style.background = color;
            alertDiv.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} me-2"></i>
                ${message}
            `;
            
            alertBox.appendChild(alertDiv);
            alertBox.style.display = 'block';
            
            // Auto hide after 5 seconds
            clearTimeout(window.alertTimeout);
            window.alertTimeout = setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // =====================================
        // PASSWORD TOGGLE
        // =====================================
        document.getElementById('togglePassword')?.addEventListener('click', function() {
            const password = document.getElementById('password');
            if (password.type === 'password') {
                password.type = 'text';
                this.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                password.type = 'password';
                this.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        document.getElementById('toggleConfirmPassword')?.addEventListener('click', function() {
            const password = document.getElementById('confirmPassword');
            if (password.type === 'password') {
                password.type = 'text';
                this.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                password.type = 'password';
                this.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // =====================================
        // PASSWORD STRENGTH CHECKER
        // =====================================
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');

            let strength = 0;
            let message = 'Weak';
            let color = '#EF4444';

            if (password.length >= 6) strength += 1;
            if (password.length >= 10) strength += 1;
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;

            if (strength >= 4) {
                message = 'Strong';
                color = '#10B981';
            } else if (strength >= 3) {
                message = 'Good';
                color = '#F59E0B';
            } else if (strength >= 2) {
                message = 'Fair';
                color = '#F97316';
            } else {
                message = 'Weak';
                color = '#EF4444';
            }

            strengthBar.style.width = (strength / 5 * 100) + '%';
            strengthBar.style.background = color;
            strengthText.textContent = `Password strength: ${message}`;
            strengthText.style.color = color;
            
            // Check confirm password
            checkPasswordMatch();
        });

        // =====================================
        // PASSWORD CONFIRMATION CHECK
        // =====================================
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('confirmPasswordError');
            
            if (confirmPassword && password !== confirmPassword) {
                document.getElementById('confirmPassword').classList.add('is-invalid');
                errorDiv.style.display = 'block';
                return false;
            } else {
                document.getElementById('confirmPassword').classList.remove('is-invalid');
                errorDiv.style.display = 'none';
                return true;
            }
        }

        document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

        // =====================================
        // REGISTER FORM SUBMIT
        // =====================================
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Get form data
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const phone = document.getElementById('phone').value.trim();
            const company = document.getElementById('company').value.trim();
            const termsCheck = document.getElementById('termsCheck').checked;

            const btn = document.getElementById('registerBtn');
            const text = document.getElementById('registerText');

            // ===== VALIDATION =====
            if (!fullName) {
                showAlert('❌ Please enter your full name');
                document.getElementById('fullName').focus();
                return;
            }

            if (!email) {
                showAlert('❌ Please enter your email address');
                document.getElementById('email').focus();
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showAlert('❌ Please enter a valid email address');
                document.getElementById('email').focus();
                return;
            }

            if (!username) {
                showAlert('❌ Please choose a username');
                document.getElementById('username').focus();
                return;
            }

            if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
                showAlert('❌ Username must be 3-20 characters (letters, numbers, underscore only)');
                document.getElementById('username').focus();
                return;
            }

            if (!password) {
                showAlert('❌ Please create a password');
                document.getElementById('password').focus();
                return;
            }

            if (password.length < 6) {
                showAlert('❌ Password must be at least 6 characters long');
                document.getElementById('password').focus();
                return;
            }

            if (!/[A-Z]/.test(password)) {
                showAlert('❌ Password must contain at least one uppercase letter');
                document.getElementById('password').focus();
                return;
            }

            if (!/[0-9]/.test(password)) {
                showAlert('❌ Password must contain at least one number');
                document.getElementById('password').focus();
                return;
            }

            if (password !== confirmPassword) {
                showAlert('❌ Passwords do not match');
                document.getElementById('confirmPassword').focus();
                return;
            }

            if (!termsCheck) {
                showAlert('❌ Please accept the Terms of Service and Privacy Policy');
                return;
            }

            // ===== SEND TO BACKEND =====
            btn.disabled = true;
            text.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i> Creating Account...`;

            // Create user data object
            const userData = {
                fullName: fullName,
                email: email,
                username: username,
                password: password,
                phone: phone || "",
                company: company || ""
            };

            console.log('📤 Sending registration data:', userData);

            try {
                const response = await fetch('http://localhost:8080/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();

                console.log('📥 Server response:', response.status, result);

                if (response.ok) {
                    showAlert('✅ Account created successfully! Redirecting to login...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html?registered=true';
                    }, 2000);
                } else {
                    let errorMsg = result.message || result.error || 'Registration failed. Please try again.';
                    
                    if (errorMsg.toLowerCase().includes('email') && errorMsg.toLowerCase().includes('already')) {
                        showAlert('❌ This email is already registered. Please login or use a different email.');
                    } else if (errorMsg.toLowerCase().includes('username') && errorMsg.toLowerCase().includes('already')) {
                        showAlert('❌ This username is already taken. Please choose a different username.');
                    } else {
                        showAlert('❌ ' + errorMsg);
                    }
                    
                    btn.disabled = false;
                    text.innerHTML = `<i class="fas fa-user-plus me-2"></i>Create Account`;
                }
            } catch (error) {
                console.error('❌ Registration error:', error);
                showAlert('❌ Cannot connect to server. Please check if backend is running on port 8080.');
                btn.disabled = false;
                text.innerHTML = `<i class="fas fa-user-plus me-2"></i>Create Account`;
            }
        });

        // =====================================
        // CHECK FOR SUCCESS PARAMETER
        // =====================================
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === 'true') {
            showAlert('✅ Account created! Please login with your credentials.', 'success');
        }
    </script>

</body>

</html>
