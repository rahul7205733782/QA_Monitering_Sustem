<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceOC · Reset Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e17;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }

        .reset-card {
            background: #141d2b;
            border: 1px solid #1e2d45;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .reset-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .reset-card .logo h2 {
            color: white;
            font-weight: 800;
            font-size: 1.8rem;
        }

        .reset-card .logo h2 i {
            color: #2DD4BF;
            margin-right: 10px;
        }

        .reset-card .logo .subtitle {
            color: #34D399;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .reset-card .title {
            color: #e8edf5;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .reset-card .description {
            color: #8899bb;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .reset-card .form-label {
            color: #94a3b8;
            font-weight: 600;
            font-size: 13px;
        }

        .reset-card .form-control {
            background: #0f172a;
            border: 1px solid #1e2d45;
            border-radius: 12px;
            padding: 12px 16px;
            color: #e8edf5;
            font-size: 14px;
            transition: all 0.3s;
        }

        .reset-card .form-control:focus {
            border-color: #2DD4BF;
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.1);
            background: #0f172a;
            color: #e8edf5;
        }

        .reset-card .form-control::placeholder {
            color: #5a6f8c;
        }

        .reset-card .form-control.is-invalid {
            border-color: #EF4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .reset-card .btn-reset {
            background: linear-gradient(95deg, #0D9488, #2DD4BF);
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            width: 100%;
            transition: 0.3s;
        }

        .reset-card .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(45, 212, 191, 0.3);
        }

        .reset-card .btn-reset:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .reset-card .btn-back {
            background: transparent;
            border: 1px solid #1e2d45;
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            color: #8899bb;
            width: 100%;
            transition: 0.3s;
            margin-top: 12px;
        }

        .reset-card .btn-back:hover {
            background: #1e2d45;
            color: #e8edf5;
        }

        /* ========================================= */
        /* PASSWORD REQUIREMENTS - FIXED */
        /* ========================================= */

        .password-requirements {
            font-size: 12px;
            color: #5a6f8c;
            margin-top: 6px;
        }

        .password-requirements .req {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
            transition: all 0.3s ease;
        }

        /* Default state - gray/neutral */
        .password-requirements .req .icon {
            font-size: 12px;
            color: #5a6f8c;
            transition: all 0.3s ease;
        }

        .password-requirements .req .text {
            color: #5a6f8c;
            transition: all 0.3s ease;
        }

        /* Valid state - green */
        .password-requirements .req.valid .icon {
            color: #10B981;
        }

        .password-requirements .req.valid .text {
            color: #10B981;
        }

        /* Invalid state - red (only shown on error) */
        .password-requirements .req.invalid .icon {
            color: #EF4444;
        }

        .password-requirements .req.invalid .text {
            color: #EF4444;
        }

        /* Checked but not valid - still gray */
        .password-requirements .req.checked:not(.valid):not(.invalid) .icon {
            color: #5a6f8c;
        }

        .password-requirements .req.checked:not(.valid):not(.invalid) .text {
            color: #5a6f8c;
        }

        .reset-card .alert {
            border-radius: 12px;
            font-size: 14px;
            padding: 12px 16px;
        }

        .reset-card .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #FCA5A5;
        }

        .reset-card .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #6EE7B7;
        }

        .reset-card .alert-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #93C5FD;
        }

        .reset-card .text-muted {
            color: #5a6f8c !important;
        }

        /* Dark Mode Support */
        .dark-mode .reset-card {
            background: #111827 !important;
            border-color: #1E293B !important;
        }

        .dark-mode .reset-card .form-control {
            background: #0F172A !important;
            border-color: #1E293B !important;
        }

        .dark-mode .reset-card .btn-back {
            border-color: #1E293B !important;
            color: #94A3B8 !important;
        }

        .dark-mode .reset-card .btn-back:hover {
            background: #1E293B !important;
            color: #F8FAFC !important;
        }

        .dark-mode .password-requirements .req .icon {
            color: #64748B !important;
        }

        .dark-mode .password-requirements .req .text {
            color: #64748B !important;
        }

        .dark-mode .password-requirements .req.valid .icon {
            color: #34D399 !important;
        }

        .dark-mode .password-requirements .req.valid .text {
            color: #34D399 !important;
        }

        .dark-mode .password-requirements .req.invalid .icon {
            color: #F87171 !important;
        }

        .dark-mode .password-requirements .req.invalid .text {
            color: #F87171 !important;
        }

        /* Responsive */
        @media(max-width:576px) {
            .reset-card {
                padding: 30px 20px;
            }
            .reset-card .title {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="reset-container">
        <div class="reset-card">
            <!-- Logo -->
            <div class="logo">
                <h2>
                    <i class="fas fa-microphone-alt"></i>
                    VoiceOC
                </h2>
                <div class="subtitle">QA DAILY TASKS</div>
            </div>

            <!-- Title -->
            <div class="title">Reset Password</div>
            <p class="description">Enter your new password below to reset your account password.</p>

            <!-- Token (hidden) -->
            <input type="hidden" id="resetToken" value="">

            <!-- Alert Messages -->
            <div id="alertContainer"></div>

            <!-- Password Form -->
            <form id="resetForm">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required>
                    
                    <!-- Password Requirements - Always visible, gray initially -->
                    <div class="password-requirements" id="passwordRequirements">
                        <div class="req" id="reqLength">
                            <span class="icon"><i class="fas fa-circle"></i></span>
                            <span class="text">At least 8 characters</span>
                        </div>
                        <div class="req" id="reqUppercase">
                            <span class="icon"><i class="fas fa-circle"></i></span>
                            <span class="text">At least one uppercase letter</span>
                        </div>
                        <div class="req" id="reqLowercase">
                            <span class="icon"><i class="fas fa-circle"></i></span>
                            <span class="text">At least one lowercase letter</span>
                        </div>
                        <div class="req" id="reqNumber">
                            <span class="icon"><i class="fas fa-circle"></i></span>
                            <span class="text">At least one number</span>
                        </div>
                        <div class="req" id="reqSpecial">
                            <span class="icon"><i class="fas fa-circle"></i></span>
                            <span class="text">At least one special character (!@#$%^&*)</span>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn-reset" id="resetBtn">
                    <i class="fas fa-key me-2"></i> Reset Password
                </button>

                <button type="button" class="btn-back" onclick="goToLogin()">
                    <i class="fas fa-arrow-left me-2"></i> Back to Login
                </button>
            </form>
        </div>
    </div>

    <script>
        // =====================================
        // GET TOKEN FROM URL
        // =====================================

        function getTokenFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token');
        }

        // =====================================
        // GO TO LOGIN
        // =====================================

        function goToLogin() {
            window.location.href = 'index.html';
        }

        // =====================================
        // VALIDATE PASSWORD - FIXED
        // =====================================

        function validatePassword(password) {
            const checks = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
            };

            // Update UI for each requirement
            const reqs = {
                length: document.getElementById('reqLength'),
                uppercase: document.getElementById('reqUppercase'),
                lowercase: document.getElementById('reqLowercase'),
                number: document.getElementById('reqNumber'),
                special: document.getElementById('reqSpecial')
            };

            for (const [key, el] of Object.entries(reqs)) {
                const icon = el.querySelector('.icon i');
                const text = el.querySelector('.text');

                if (password.length === 0) {
                    // Empty password - show gray circle
                    el.className = 'req';
                    icon.className = 'fas fa-circle';
                    text.style.color = '';
                } else if (checks[key]) {
                    // Valid - show green check
                    el.className = 'req valid';
                    icon.className = 'fas fa-check-circle';
                } else {
                    // Invalid - show red circle
                    el.className = 'req invalid';
                    icon.className = 'fas fa-times-circle';
                }
            }

            return Object.values(checks).every(v => v === true);
        }

        // =====================================
        // SHOW ALERT
        // =====================================

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const colors = {
                danger: 'alert-danger',
                success: 'alert-success',
                info: 'alert-info'
            };
            container.innerHTML = `
                <div class="alert ${colors[type] || 'alert-info'} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;

            // Auto dismiss after 5 seconds
            setTimeout(() => {
                const alert = container.querySelector('.alert');
                if (alert) {
                    alert.classList.remove('show');
                    setTimeout(() => {
                        container.innerHTML = '';
                    }, 300);
                }
            }, 5000);
        }

        function clearAlerts() {
            document.getElementById('alertContainer').innerHTML = '';
        }

        // =====================================
        // PASSWORD INPUT EVENT
        // =====================================

        document.getElementById('newPassword').addEventListener('input', function() {
            validatePassword(this.value);
        });

        // =====================================
        // CONFIRM PASSWORD VALIDATION
        // =====================================

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = this.value;

            if (confirmPassword.length > 0 && newPassword !== confirmPassword) {
                this.classList.add('is-invalid');
            } else {
                this.classList.remove('is-invalid');
            }
        });

        // =====================================
        // FORM SUBMIT
        // =====================================

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearAlerts();

            const token = document.getElementById('resetToken').value || getTokenFromUrl();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate token
            if (!token) {
                showAlert('❌ Invalid or missing reset token. Please request a new password reset.', 'danger');
                return;
            }

            // Validate password
            if (!validatePassword(newPassword)) {
                // Show all requirements in red
                const reqs = document.querySelectorAll('.password-requirements .req');
                reqs.forEach(el => {
                    if (!el.classList.contains('valid')) {
                        el.classList.add('invalid');
                        const icon = el.querySelector('.icon i');
                        if (icon) {
                            icon.className = 'fas fa-times-circle';
                        }
                    }
                });
                showAlert('❌ Please ensure your password meets all the requirements.', 'danger');
                return;
            }

            // Check if passwords match
            if (newPassword !== confirmPassword) {
                document.getElementById('confirmPassword').classList.add('is-invalid');
                showAlert('❌ Passwords do not match. Please try again.', 'danger');
                return;
            }

            // Disable button
            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Resetting...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('✅ Password reset successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2500);
                } else {
                    showAlert('❌ ' + (data.message || 'Failed to reset password. Please try again.'), 'danger');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-key me-2"></i> Reset Password';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('❌ Network error. Please check your connection and try again.', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key me-2"></i> Reset Password';
            }
        });

        // =====================================
        // CHECK TOKEN ON LOAD
        // =====================================

        document.addEventListener('DOMContentLoaded', function() {
            const token = getTokenFromUrl();
            if (token) {
                document.getElementById('resetToken').value = token;
                console.log('✅ Reset token found:', token);
            } else {
                showAlert('⚠️ No reset token found. Please request a password reset first.', 'info');
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
